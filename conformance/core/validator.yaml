# ==============================================================================
# A2UI Conformance Suite: Pure Schema Validation
#
# This suite verifies that A2UI message envelopes, catalog component properties,
# function call parameters, and theme objects strictly adhere to their respective
# JSON Schema specifications across protocol versions (v0.8, v0.9, v1.0).
# Graph topology and runtime state integrity checks are tested in message_processor.yaml.
# ==============================================================================

# ==============================================================================
# Part 1: Protocol v0.8 Schema Validation
# ==============================================================================

- name: test_validator_0_8
  description: Tests schema validation of v0.8 message envelopes.
  catalog:
    version: "0.8"
    s2c_schema: "test_data/simplified_s2c_v08.json"
    catalog_schema:
      catalogId: standard
      components: {}
  action: validate
  steps:
    - payload:
        - beginRendering:
            surfaceId: test-id
            root: root
            styles:
              primaryColor: "#ff0000"
    - payload:
        - beginRendering:
            surfaceId: 123
            root: root
      expect_error: "123 is not of type 'string'"
    - payload:
        - beginRendering:
            surfaceId: id
            root: root
            styles: not-an-object
      expect_error: "'not-an-object' is not of type 'object'"
    - payload:
        - beginRendering:
            surfaceId: id
      expect_error: "'root' is a required property"

- name: test_custom_catalog_0_8
  description: Tests component property schema validation in v0.8 against custom catalog schema.
  catalog:
    version: "0.8"
    s2c_schema: "test_data/simplified_s2c_v08.json"
    catalog_schema:
      catalogId: custom
      components:
        Canvas:
          type: object
          properties:
            children:
              type: object
              properties:
                explicitList:
                  type: array
                  items:
                    type: string
              required:
                - explicitList
          required:
            - children
          additionalProperties: false
        Chart:
          type: object
          properties:
            type:
              type: string
              enum:
                - doughnut
                - pie
            chartData:
              type: object
              properties:
                path:
                  type: string
              required:
                - path
          required:
            - type
            - chartData
  action: validate
  steps:
    - payload:
        - beginRendering:
            surfaceId: s1
            root: root
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: root
                component:
                  Canvas:
                    children:
                      explicitList:
                        - c1
                        - c2
              - id: c1
                component:
                  Canvas:
                    children:
                      explicitList: []
              - id: c2
                component:
                  Chart:
                    type: pie
                    chartData:
                      path: /data
    - payload:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  Chart:
                    type: line
                    chartData:
                      path: /data
      expect_error: "is not one of"
    - payload:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  Canvas:
                    children:
                      explicitList: 123
      expect_error: "123 is not of type 'array'"
    - payload:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  Canvas:
                    children: {}
      expect_error: "'explicitList' is a required property"
    - payload:
        - surfaceUpdate:
            surfaceId: s1
            components:
              - id: c1
                component:
                  Canvas:
                    children:
                      explicitList: []
                    extraProperty: should-fail
      expect_error: "Additional properties are not allowed"

# ==============================================================================
# Part 2: Protocol v0.9 / v0.9.1 Schema Validation
# ==============================================================================

- name: test_validator_0_9
  description: Tests schema validation of v0.9 message envelopes.
  catalog:
    version: "0.9"
    common_types_schema: "test_data/simplified_common_types_v09.json"
    s2c_schema: "test_data/simplified_s2c_v09.json"
    catalog_schema: "test_data/simplified_catalog_v09.json"
  action: validate
  steps:
    - payload:
        - version: "v0.9"
          createSurface:
            surfaceId: test-id
            catalogId: standard
            theme:
              primaryColor: blue
              iconUrl: http://img
    - payload:
        - createSurface:
            surfaceId: "123"
            catalogId: standard
      expect_error:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "missing_field"
    - payload:
        - version: "v0.8"
          createSurface:
            surfaceId: "123"
            catalogId: standard
      expect_error:
        category: "ValidationError"
        details:
          - path: "messages.0.version"
            code: "invalid_value"
    - payload:
        - version: "v0.9"
          createSurface:
            surfaceId: 123
            catalogId: standard
      expect_error:
        category: "ValidationError"
        details:
          - path: "messages.0.createSurface.surfaceId"
            code: "type_mismatch"
    - payload:
        - version: "v0.9"
          createSurface:
            surfaceId: "123"
      expect_error:
        category: "ValidationError"
        details:
          - path: "messages.0.createSurface.catalogId"
            code: "missing_field"

- name: test_custom_catalog_0_9
  description: Tests component property schema validation in v0.9 against custom catalog schema.
  catalog:
    version: "0.9"
    common_types_schema: "test_data/simplified_common_types_v09.json"
    s2c_schema: "test_data/simplified_s2c_v09.json"
    catalog_schema:
      catalogId: custom
      components:
        Canvas:
          type: object
          allOf:
            - $ref: "common_types.json#/$defs/ComponentCommon"
            - type: object
              properties:
                component:
                  const: Canvas
                children:
                  $ref: "common_types.json#/$defs/ChildList"
              required:
                - component
                - children
        Chart:
          type: object
          allOf:
            - $ref: "common_types.json#/$defs/ComponentCommon"
            - type: object
              properties:
                component:
                  const: Chart
                chartType:
                  enum:
                    - doughnut
                    - pie
                title:
                  $ref: "common_types.json#/$defs/DynamicString"
              required:
                - component
                - chartType
                - title
  action: validate
  steps:
    - payload:
        - version: "v0.9"
          createSurface:
            surfaceId: s1
            catalogId: custom
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: root
                component: Canvas
                children:
                  - c1
                  - c2
              - id: c1
                component: Canvas
                children: []
              - id: c2
                component: Chart
                chartType: pie
                title: My Chart
    - payload:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Chart
                chartType: line
                title: Invalid Chart
      expect_error:
        category: "ValidationError"
        details:
          - path: "chartType"
            code: "invalid_value"
    - payload:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Canvas
                children: 123
      expect_error:
        category: "ValidationError"
        details:
          - path: "children"
            code: "invalid_value"
    - payload:
        - version: "v0.9"
          updateComponents:
            surfaceId: s1
            components:
              - id: c1
                component: Canvas
      expect_error:
        category: "ValidationError"
        details:
          - path: "root"
            code: "missing_field"

# ==============================================================================
# Part 3: Protocol v1.0 Schema Validation
# ==============================================================================

- name: test_validator_1_0
  description: Tests schema validation of v1.0 message envelopes (inline components, optional catalogId, data deletion).
  catalog:
    version: "1.0"
    experiments: ["version_1_0"]
    s2c_schema:
      $id: "https://a2ui.org/specification/v1_0/json/agent_to_renderer.json"
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        version:
          type: string
          enum: ["1.0", "v1.0"]
        createSurface:
          type: object
          required: ["surfaceId"]
          properties:
            surfaceId:
              type: string
            catalogId:
              type: string
            sendDataModel:
              type: boolean
            components:
              type: array
              items:
                $ref: "catalog.json#/components/Text"
            dataModel:
              type: object
          additionalProperties: false
        updateDataModel:
          type: object
          required: ["surfaceId"]
          properties:
            surfaceId:
              type: string
            path:
              type: string
            value: {}
          additionalProperties: false
      required: ["version"]
    common_types_schema: {}
    catalog_schema:
      catalogId: "https://a2ui.org/test_catalog"
      components:
        Text:
          type: object
          properties:
            id:
              type: string
            component:
              const: "Text"
            text:
              type: string
          required: ["id", "component", "text"]
      $defs:
        anyComponent:
          oneOf:
            - $ref: "#/components/Text"
          discriminator:
            propertyName: "component"
  action: validate
  steps:
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "s1"
            catalogId: "test_catalog"
            sendDataModel: true
            components:
              - id: "root"
                component: "Text"
                text: "Inline Text"
            dataModel:
              counter: 100
    - payload:
        - version: "v1.0"
          createSurface:
            surfaceId: "s_nocat"
    - payload:
        - version: "v1.0"
          updateDataModel:
            surfaceId: "s1"
            path: "/user/token"
            value: null

- name: test_validator_theme_schema
  description: Tests schema validation of surface theme properties against catalog theme schema.
  catalog:
    version: "0.9"
    common_types_schema: "test_data/simplified_common_types_v09.json"
    s2c_schema: "test_data/simplified_s2c_v09.json"
    catalog_schema:
      catalogId: "theme_cat"
      theme:
        type: "object"
        properties:
          primaryColor:
            type: "string"
            pattern: "^#[0-9a-fA-F]{6}$"
        required: ["primaryColor"]
        additionalProperties: false
  action: validate
  steps:
    - payload:
        - version: "v0.9"
          createSurface:
            surfaceId: "s1"
            catalogId: "theme_cat"
            theme:
              primaryColor: "#ff0000"
    - payload:
        - version: "v0.9"
          createSurface:
            surfaceId: "s1"
            catalogId: "theme_cat"
            theme:
              primaryColor: "not-a-hex"
      expect_error:
        category: "ValidationError"
